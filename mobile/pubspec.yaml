name: readx
description: "ReadX — reading habits, posts and monthly points."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.20
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/readx_logo.svg
